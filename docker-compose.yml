services:
  bot:
    build: .
    container_name: aiogram_bot
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override the REDIS_URL to point to the docker redis service
      - REDIS_URL=redis://redis:6379/0
      - DB_PATH=/app/data/bot_data.db
    volumes:
      # Persist the sqlite database on the host machine
      - ./data:/app/data
    restart: unless-stopped
    # The bot touches /tmp/aibot_healthy every 30s; if it goes stale the
    # process is hung and docker marks the container unhealthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/tmp/aibot_healthy'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<120 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Needed to reach Ollama running on the host machine via host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7-alpine
    container_name: aiogram_redis
    # No ports: exposed on purpose - the bot reaches redis over the internal
    # compose network, and a passwordless redis must never listen publicly.
    volumes:
      # Persist the redis queues
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Optional: run Ollama in docker instead of on the host.
  # Enable with: docker compose --profile ollama up -d
  # (or put COMPOSE_PROFILES=ollama in .env) and set
  # OLLAMA_API_BASE=http://ollama:11434/v1
  ollama:
    image: ollama/ollama
    container_name: aiogram_ollama
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  redis_data:
  ollama_data:
